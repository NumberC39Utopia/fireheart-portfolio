<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, viewport-fit=cover"
	>

	<title>Utopia's Portfolio | Fireheart Studios</title>

	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #000000;
		}

		#game-container {
			position: fixed;
			inset: 0;
			width: 100vw;

			/* Fallback for older browsers */
			height: 100vh;

			/* Better sizing for modern and mobile browsers */
			height: 100dvh;
		}

		#game-container iframe {
			display: block;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			border: 0;
		}
	</style>
</head>

<body>
	<div id="game-container">
		<iframe
			title="Utopia's Portfolio"
			src="https://itch.io/embed-upload/19073878?color=000000"
			allow="autoplay; fullscreen; gamepad"
			allowfullscreen
		>
			<a href="https://number39utopia.itch.io/utopias-portfolio">
				Play Utopia's Portfolio on itch.io
			</a>
		</iframe>
	</div>
</body>
</html>
